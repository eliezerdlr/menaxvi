schema: menaxvi.workflow/v1
id: wf-decision-framework
name: Structured strategic decision
principles:
  - evidence_before_assertion
  - independent_analysis_before_synthesis
  - explicit_decision_owner
  - reversible_stages
stages:
  - id: define_criteria
    requires_review: true
  - id: collect_evidence
    requires_review: true
  - id: generate_options
    requires_review: true
  - id: score_tradeoffs
    requires_review: true
  - id: stress_test
    requires_review: true
  - id: recommend
    requires_review: true
outputs:
  - decision_brief
  - action_register
  - risk_and_assumption_log
