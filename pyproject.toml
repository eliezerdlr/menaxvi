[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "menaxvi"
version = "0.1.0"
description = "Governed validation tooling for the MENAXVI product repository"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Eliezer Rodrigues" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
menaxvi = "menaxvi.cli:main"

[tool.setuptools]
package-dir = { "" = "tooling" }

[tool.setuptools.packages.find]
where = ["tooling"]

[tool.setuptools.package-data]
menaxvi = ["dashboard.html"]

[tool.unittest]
start-directory = "tests"
