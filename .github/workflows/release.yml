name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate tagged source
        run: python3 scripts/release_gate.py
      - name: Build deterministic artifact
        run: python3 scripts/build_release.py
      - name: Verify artifact checksum
        run: cd dist && sha256sum --check menaxvi-0.1.0.pyz.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/menaxvi-0.1.0.pyz
          dist/menaxvi-0.1.0.pyz.sha256
          --verify-tag
          --generate-notes
          --title "MENAXVI ${GITHUB_REF_NAME}"
