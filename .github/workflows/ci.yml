name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show Python version
        run: python3 --version
      - name: Install reviewed test dependency
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Run MENAXVI release gate
        run: python3 scripts/release_gate.py
      - name: Build deterministic artifact
        run: python3 scripts/build_release.py
      - name: Verify artifact checksum
        run: cd dist && sha256sum --check menaxvi-0.1.0.pyz.sha256
