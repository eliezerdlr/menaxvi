name: Feature request
description: Propose a bounded capability or workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: What should a user be able to verify when this is complete?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security, provenance, and approval constraints
      description: Identify authorization, data, rights, migration, or rollback requirements.
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should explicitly remain outside this change?
